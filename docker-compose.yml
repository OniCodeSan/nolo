services:
  # Copia esatta di moviq.it: serve la dist scaricata dal server con
  # `sh scripts/pull-prod.sh`, con lo stesso nginx del vhost live.
  prod:
    image: nginx:alpine
    container_name: moviq-prod
    ports:
      - "8081:80"
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/prod-dist:/usr/share/nginx/html:ro
    restart: unless-stopped
