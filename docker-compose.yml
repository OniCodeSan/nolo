services:
  # Copia esatta di moviq.it: serve la dist scaricata dal server con
  # `sh scripts/pull-prod.sh`, con lo stesso nginx del vhost live.
  prod:
    image: nginx:alpine
    container_name: moviq-prod
    ports:
      - "8081:80"
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/prod-dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Stage: il codice locale buildato come per il deploy (`sh scripts/build-stage.sh`),
  # nginx di prod + modifiche in attesa di deploy (nginx.stage.conf). Per provare
  # le modifiche prima di andare in produzione.
  stage:
    image: nginx:alpine
    container_name: moviq-stage
    ports:
      - "8083:80"
    volumes:
      - ./.docker/nginx.stage.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/stage-dist:/usr/share/nginx/html:ro
    restart: unless-stopped
