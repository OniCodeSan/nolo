# Specchio del vhost di produzione (/etc/nginx/sites-available/moviq su Hetzner),
# senza la parte SSL/certbot. Tenerlo allineato: se cambia il vhost live, cambia qui.
# NB: in prod NON sono attivi header di sicurezza (vedi security-headers.conf).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Magazine rinominato: /blog → /magazine, anche con prefisso lingua
    # (/en/blog/x → /en/magazine/x), query string conservata. 301 = permanente,
    # Google trasferisce il posizionamento ai nuovi URL.
    location ~ ^(/(?:en|es|de|pt|fr))?/blog(/.*)?$ {
        absolute_redirect off;   # Location relativa: vale dietro porte e proxy
        return 301 $1/magazine$2$is_args$args;
    }

    # Webhook R-Pie: R-Pie accetta solo indirizzi sul dominio del progetto,
    # quindi https://moviq.it/api/r-pie inoltra all'edge function Supabase.
    # Niente redirect e corpo inoltrato intatto (la firma HMAC è sul corpo grezzo).
    # Il nome di Supabase va risolto A OGNI RICHIESTA (resolver + variabile),
    # non all'avvio: il 5 nov 2026 un riavvio di nginx con il DNS giù ha
    # fallito su questo host e ha tenuto offline tutto il server per 31 ore.
    location = /api/r-pie {
        resolver 127.0.0.11 valid=300s ipv6=off;   # DNS di Docker; in prod 127.0.0.53 (systemd-resolved)
        resolver_timeout 5s;
        set $rpie_upstream https://togcwgymwrnhiihduapb.supabase.co/functions/v1/magazine-webhook;
        proxy_pass $rpie_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host togcwgymwrnhiihduapb.supabase.co;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 20s;
        client_max_body_size 2m;
    }

    # SPA fallback (React Router) + pagine prerenderizzate.
    # $uri.html serve i file statici generati dal prerender, incluse le rotte
    # con prefisso lingua annidato (es. /en/magazine/<slug> → /en/magazine/<slug>.html).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache aggressivo per asset con hash nel nome
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Non cachare index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compressione
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
