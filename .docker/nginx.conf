# Specchio del vhost di produzione (/etc/nginx/sites-available/moviq su Hetzner),
# senza la parte SSL/certbot. Tenerlo allineato: se cambia il vhost live, cambia qui.
# NB: in prod NON sono attivi header di sicurezza (vedi security-headers.conf).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (React Router) + pagine prerenderizzate.
    # $uri.html serve i file statici generati dal prerender, incluse le rotte
    # con prefisso lingua annidato (es. /en/blog/<slug> → /en/blog/<slug>.html).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache aggressivo per asset con hash nel nome
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Non cachare index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compressione
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
